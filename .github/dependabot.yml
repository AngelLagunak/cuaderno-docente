# Avisos y propuestas de actualización de dependencias y de las acciones de GitHub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 aún no lo admite typescript-eslint (pide < 6.1): se actualizará cuando lo admita.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # React 19 cambia la API: es una migración aparte, no una actualización automática.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react*"
        update-types: [version-update:semver-major]
    groups:
      desarrollo:
        dependency-type: development
      app:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
